services:
  contract_app:
    build:
      context: ../flask_contract_app
      dockerfile: Dockerfile
    container_name: contract_ui_admin
    ports:
      - "5000:5000"
    environment:
      - TEMPLATE_DIR=/app/uploaded_templates
      - FASTAPI_BASE_URL=http://doc_service:8000
    volumes:
      - ../flask_contract_app/uploaded_templates:/app/uploaded_templates

  doc_service:
    build:
      context: ../fastapi_doc_service
      dockerfile: Dockerfile
    container_name: doc_service_api
    ports:
      - "8000:8000"
    environment:
      - TEMPLATE_DIR=/app/uploaded_templates
    volumes:
      - ../flask_contract_app/uploaded_templates:/app/uploaded_templates